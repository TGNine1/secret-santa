<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>🎄 Secret Santa – Uczestnik 🎁</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #ffeedd, #f8f3ea);
      color: #222;
    }
    main {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 1px solid rgba(139,0,0,0.15);
      padding: 24px 20px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }
    h1 span.emoji {
      font-size: 26px;
    }
    .subtitle {
      font-size: 13px;
      color: #555;
      margin-top: 0;
      margin-bottom: 16px;
    }
    #info {
      font-size: 15px;
      margin-bottom: 8px;
    }
    #result {
      font-size: 18px;
      font-weight: 600;
      color: #8b0000;
      margin-top: 8px;
    }
    .error {
      color: #b22222;
      font-size: 14px;
      margin-top: 8px;
    }
    .small {
      font-size: 12px;
      color: #777;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>
        <span class="emoji">🎄</span>
        Secret Santa
        <span class="emoji">🎁</span>
      </h1>
      <p class="subtitle">
        Otworzyłeś osobisty link do losowania prezentów. Sprawdź, komu kupujesz prezent!
      </p>

      <p id="info"></p>
      <p id="result"></p>
      <p id="error" class="error"></p>

      <p class="small">
        Jeśli coś wygląda nie tak (np. błąd lub puste dane), skontaktuj się z organizatorem losowania.
      </p>
    </div>
  </main>

  <!-- Supabase JS client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
// === KONFIGURACJA SUPABASE ===
const SUPABASE_URL = "https://xlvrqqcaaopvtsxxdymt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsdnJxcWNhYW9wdnRzeHhkeW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNjQ4MzIsImV4cCI6MjA4MDk0MDgzMn0.v30XN8V0UvxDMfRp3JWFCPR8aThoh0E4fTR_oHqiXSU";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

async function showResult() {
  const infoEl = document.getElementById('info');
  const resultEl = document.getElementById('result');
  const errorEl = document.getElementById('error');

  errorEl.textContent = '';
  resultEl.textContent = '';
  infoEl.textContent = '';

  const drawId = getQueryParam('drawId');
  const name = getQueryParam('name');
  const token = getQueryParam('token');

  if (!drawId || !name || !token) {
    errorEl.textContent = 'Brak wymaganych parametrów w linku. Skontaktuj się z organizatorem.';
    return;
  }

  infoEl.textContent = `Cześć, ${name}!`;

  try {
    const { data, error } = await supabase
      .from('assignments')
      .select('receiver, token')
      .eq('draw_id', drawId)
      .eq('name', name)
      .limit(1)
      .maybeSingle();

    if (error) {
      console.error(error);
      errorEl.textContent = 'Błąd podczas wczytywania wyniku. Spróbuj ponownie albo skontaktuj się z organizatorem.';
      return;
    }

    if (!data) {
      errorEl.textContent = 'Nie znaleziono Twojego wpisu. Sprawdź, czy masz właściwy link.';
      return;
    }

    if (data.token !== token) {
      errorEl.textContent = 'Ten link wydaje się nieprawidłowy lub wygasł. Skontaktuj się z organizatorem.';
      return;
    }

    resultEl.textContent = 'Kupujesz prezent dla: ' + data.receiver + ' 🎁' + 'Wesołych Świąt!';

  } catch (e) {
    console.error(e);
    errorEl.textContent = 'Nieoczekiwany błąd. Spróbuj ponownie później.';
  }
}

showResult();
</script>
</body>
</html>
