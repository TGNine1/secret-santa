<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Secret Santa – Uczestnik (Supabase)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 500px; }
    .box { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
    #result { font-weight: bold; margin-top: 15px; }
    .small { font-size: 0.9em; color: #555; }
  </style>
</head>
<body>
  <h1>Secret Santa – Uczestnik</h1>

  <div class="box">
    <p id="info" class="small"></p>
    <p id="result"></p>
  </div>

  <!-- Supabase JS client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
// === KONFIGURACJA SUPABASE ===
const SUPABASE_URL = "https://xlvrqqcaaopvtsxxdymt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsdnJxcWNhYW9wdnRzeHhkeW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNjQ4MzIsImV4cCI6MjA4MDk0MDgzMn0.v30XN8V0UvxDMfRp3JWFCPR8aThoh0E4fTR_oHqiXSU";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

async function showResult() {
  const infoEl = document.getElementById('info');
  const resultEl = document.getElementById('result');

  const drawId = getQueryParam('drawId');
  const name = getQueryParam('name');
  const token = getQueryParam('token');

  if (!drawId || !name || !token) {
    infoEl.textContent = 'Brak wymaganych parametrów w linku. Skontaktuj się z organizatorem.';
    return;
  }

  infoEl.textContent = `Cześć, ${name}!`;

  try {
    const { data, error } = await supabase
      .from('assignments')
      .select('receiver, token')
      .eq('draw_id', drawId)
      .eq('name', name)
      .limit(1)
      .maybeSingle();

    if (error) {
      console.error(error);
      resultEl.textContent = 'Błąd podczas wczytywania wyniku. Skontaktuj się z organizatorem.';
      return;
    }

    if (!data) {
      resultEl.textContent = 'Nie znaleziono Twojego wpisu. Sprawdź, czy masz właściwy link.';
      return;
    }

    if (data.token !== token) {
      resultEl.textContent = 'Ten link wydaje się nieprawidłowy lub wygasł. Skontaktuj się z organizatorem.';
      return;
    }

    resultEl.textContent = 'Kupujesz prezent dla: ' + data.receiver;

  } catch (e) {
    console.error(e);
    resultEl.textContent = 'Nieoczekiwany błąd. Spróbuj ponownie później.';
  }
}

showResult();
</script>
</body>
</html>
