<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>🎄 Secret Santa – Uczestnik 🎁</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <style>
    :root {
      --bg-main: #f3efe7;
      --bg-card: #ffffff;
      --accent-red: #8b0000;
      --accent-green: #0f8b0f;
      --text-main: #222222;
      --text-muted: #777777;
      --shadow-soft: 0 4px 16px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-main);
      color: var(--text-main);
    }

    main {
      max-width: 520px;
      margin: 24px auto;
      padding: 0 12px 24px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(139,0,0,0.25);
      padding: 20px 18px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 22px;
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
      color: var(--accent-red);
    }

    h1 span.emoji {
      font-size: 24px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 16px;
    }

    #info {
      font-size: 15px;
      margin-bottom: 8px;
    }

    #result {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-green);
      margin-top: 8px;
    }

    #error {
      color: var(--accent-red);
      font-size: 14px;
      margin-top: 8px;
      min-height: 18px;
    }

    .small {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 18px;
      line-height: 1.4;
    }

    footer {
      max-width: 520px;
      margin: 0 auto 16px auto;
      padding: 0 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    footer a {
      color: var(--accent-red);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (min-width: 768px) {
      main {
        margin-top: 40px;
      }
      h1 {
        font-size: 24px;
      }
      #result {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>
        <span class="emoji">🎄</span>
        Secret Santa
        <span class="emoji">🎁</span>
      </h1>
      <p class="subtitle">
        Otworzyłeś osobisty link do losowania prezentów. Sprawdź, komu kupujesz prezent!
      </p>

      <p id="info"></p>
      <p id="result"></p>
      <p id="budgetInfo" class="small"></p>
      <p id="wishInfo" class="small"></p>
      <p id="error"></p>

      <p class="small">
        Jeśli coś wygląda nie tak (np. błąd lub puste dane), skontaktuj się z organizatorem losowania.
      </p>
    </div>
  </main>

  <footer>
    Stworzone na użytek prywatny przez
    <a href="https://github.com/tgnine1" target="_blank" rel="noopener">@TGNine1</a>
  </footer>

  <!-- Supabase JS client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
  // === KONFIGURACJA SUPABASE ===
  // Klucz "anon" jest publiczny z założenia. Bezpieczeństwo zapewniają reguły w bazie
  // (patrz supabase-setup.sql): wynik zwraca funkcja get_assignment tylko przy poprawnym tokenie.
  const SUPABASE_URL = "https://xlvrqqcaaopvtsxxdymt.supabase.co";            // <-- zostaw / podmień na swój
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsdnJxcWNhYW9wdnRzeHhkeW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNjQ4MzIsImV4cCI6MjA4MDk0MDgzMn0.v30XN8V0UvxDMfRp3JWFCPR8aThoh0E4fTR_oHqiXSU"; // <-- zostaw / podmień na swój

  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  // Zwraca poprawny adres http(s) albo null (blokuje m.in. javascript:)
  function safeHttpUrl(value) {
    try {
      const u = new URL(value);
      return (u.protocol === 'https:' || u.protocol === 'http:') ? u.toString() : null;
    } catch (e) {
      return null;
    }
  }

  async function showResult() {
    const infoEl = document.getElementById('info');
    const resultEl = document.getElementById('result');
    const errorEl = document.getElementById('error');
    const budgetEl = document.getElementById('budgetInfo');
    const wishEl = document.getElementById('wishInfo');

    errorEl.textContent = '';
    resultEl.textContent = '';
    infoEl.textContent = '';
    budgetEl.textContent = '';
    wishEl.textContent = '';

    const drawId = getQueryParam('drawId');
    const name = getQueryParam('name');
    const token = getQueryParam('token');

    if (!drawId || !name || !token) {
      errorEl.textContent = 'Brak wymaganych parametrów w linku. Skontaktuj się z organizatorem.';
      return;
    }

    infoEl.textContent = `Cześć, ${name}!`;

    try {
      // Serwer sprawdza token i zwraca wyłącznie wynik tej jednej osoby.
      const { data, error } = await _supabase.rpc('get_assignment', {
        p_draw_id: drawId,
        p_name: name,
        p_token: token
      });

      if (error) {
        console.error(error);
        errorEl.textContent = 'Błąd podczas wczytywania wyniku. Spróbuj ponownie albo skontaktuj się z organizatorem.';
        return;
      }

      const row = Array.isArray(data) ? data[0] : data;
      if (!row) {
        errorEl.textContent = 'Nie znaleziono wyniku. Sprawdź, czy masz właściwy, kompletny link, albo skontaktuj się z organizatorem.';
        return;
      }

      resultEl.textContent = 'Kupujesz prezent dla: ' + row.receiver + ' 🎁';

      if (row.budget && row.budget.trim() !== '') {
        budgetEl.textContent = 'Ustalony budżet na prezenty: ' + row.budget;
      }

      const wishUrl = row.wish_link ? safeHttpUrl(row.wish_link.trim()) : null;
      if (wishUrl) {
        wishEl.textContent = 'Lista życzeń: ';
        const a = document.createElement('a');
        a.href = wishUrl;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.color = '#0f8b0f';
        a.textContent = 'otwórz plik z życzeniami';
        wishEl.appendChild(a);
      }

    } catch (e) {
      console.error(e);
      errorEl.textContent = 'Nieoczekiwany błąd. Spróbuj ponownie później.';
    }
  }

  showResult();
</script>
</body>
</html>
