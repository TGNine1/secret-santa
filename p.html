<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#8b0000">
  <!-- Link previews (Messenger, WhatsApp) do not run JavaScript, so this text is bilingual -->
  <title>🎁 Twoje losowanie · Your Secret Santa draw</title>
  <meta name="description" content="To Twój osobisty link. Otwórz go, żeby sprawdzić, komu kupujesz prezent. · Your personal link: open it to see who you're buying a gift for.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="🎁 Twoje losowanie Secret Santa · Your Secret Santa draw">
  <meta property="og:description" content="To Twój osobisty link. Otwórz go, żeby sprawdzić, komu kupujesz prezent. · Your personal link: open it to see who you're buying a gift for.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E">
  <style>
    /* ===== Wspólne wartości / Shared values (te same w index.html i p.html) ===== */
    :root {
      --red: #8b0000;
      --red-2: #b22222;
      --green: #0b6e0b;
      --green-dark: #095a09;
      --bg: #f4efe6;
      --card: #ffffff;
      --text: #222222;
      --muted: #5f5f5f;
      --line: #e3d8c3;
      --field-border: #8a8272;
      --err: #b00020;
      --ok: #0b6e0b;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
      /* type scale: 13 / 16 / 20 / 36 */
      --fs-sm: 13px;
      --fs-md: 16px;
      --fs-lg: 20px;
      --fs-xl: 36px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: var(--fs-md);
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }

    :focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 2px;
    }

    header.site {
      background: linear-gradient(90deg, var(--red), var(--red-2));
      color: #fff;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .site-inner {
      max-width: 488px;
      margin: 0 auto;
    }
    header.site h1 {
      margin: 0;
      font-size: var(--fs-lg);
      line-height: 1.3;
    }
    header.site p {
      margin: 4px 0 0;
      font-size: var(--fs-sm);
      color: rgba(255, 255, 255, 0.92);
    }

    main {
      max-width: 520px;
      margin: 24px auto;
      padding: 0 16px 8px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: var(--shadow);
      padding: 28px 20px;
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 22px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--green);
      border: 2px solid var(--green);
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn:hover { background: var(--green-dark); border-color: var(--green-dark); }
    .btn-outline { color: var(--green); background: transparent; }
    .btn-outline:hover { color: #fff; }
    .btn-lg {
      min-height: 56px;
      padding: 12px 32px;
      font-weight: 700;
    }

    /* ----- page states ----- */
    #loading { margin: 0; color: var(--muted); }

    #greeting {
      margin: 0 0 4px;
      font-size: var(--fs-lg);
      font-weight: 700;
    }

    .gift {
      display: block;
      margin: 16px 0 20px;
      font-size: 64px;
      line-height: 1;
    }

    #error {
      margin: 0;
      color: var(--err);
      font-weight: 600;
    }
    #error:empty { display: none; }

    /* ----- revealed result: the most important thing on the page ----- */
    #reveal:focus { outline: none; }
    .reveal-label {
      margin: 12px 0 4px;
      color: var(--muted);
    }
    #receiverName {
      margin: 0 0 20px;
      font-size: var(--fs-xl);
      font-weight: 800;
      line-height: 1.15;
      color: var(--red);
      overflow-wrap: anywhere;
    }
    .details {
      padding-top: 20px;
      border-top: 1px dashed var(--line);
    }
    #budgetInfo { margin: 0 0 16px; }
    #wishLink { margin: 0; }
    .secret {
      margin: 20px 0 0;
      font-size: var(--fs-sm);
      color: var(--muted);
    }

    @media (prefers-reduced-motion: no-preference) {
      #reveal:not([hidden]) #receiverName {
        animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: none; }
    }

    footer {
      max-width: 520px;
      margin: 0 auto 16px;
      padding: 0 16px;
      font-size: var(--fs-sm);
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--red); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (min-width: 768px) {
      main { margin-top: 40px; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="site-inner">
      <h1><span aria-hidden="true">🎄</span> Secret Santa <span aria-hidden="true">🎁</span></h1>
      <p data-i18n="subtitle">Osobisty link do losowania prezentów.</p>
    </div>
  </header>

  <main>
    <div class="card">
      <p id="loading" role="status" data-i18n="loading">Wczytuję…</p>

      <p id="greeting" hidden></p>

      <div id="gate" hidden>
        <span class="gift" aria-hidden="true">🎁</span>
        <button type="button" class="btn btn-lg" id="revealBtn" data-i18n="revealBtn">Pokaż mój wynik</button>
      </div>

      <div id="reveal" tabindex="-1" hidden>
        <p class="reveal-label" data-i18n="revealLabel">Kupujesz prezent dla:</p>
        <p id="receiverName"></p>
        <div class="details" id="details" hidden>
          <p id="budgetInfo" hidden></p>
          <a id="wishLink" class="btn btn-outline" target="_blank" rel="noopener noreferrer" hidden data-i18n="wishBtn">Otwórz listę życzeń</a>
        </div>
        <p class="secret" data-i18n="secret">Zachowaj to w tajemnicy 🤫</p>
      </div>

      <p id="error" role="alert"></p>
    </div>
  </main>

  <footer>
    <span data-i18n="footer">Stworzone na użytek prywatny przez</span>
    <a href="https://github.com/tgnine1" target="_blank" rel="noopener">@TGNine1</a>
  </footer>

<!-- Tłumaczenia: uruchamiane przed pobraniem biblioteki, żeby nie mignął zły język -->
<!-- Translations: run before the library loads so the wrong language never flashes -->
<script>
  const T = {
    pl: {
      docTitle: `🎁 Twoje losowanie Secret Santa`,
      subtitle: `Osobisty link do losowania prezentów.`,
      loading: `Wczytuję…`,
      revealBtn: `Pokaż mój wynik`,
      revealLabel: `Kupujesz prezent dla:`,
      wishBtn: `Otwórz listę życzeń`,
      secret: `Zachowaj to w tajemnicy 🤫`,
      footer: `Stworzone na użytek prywatny przez`,
      budget: `Budżet na prezenty: `,
      errParams: `Brak wymaganych parametrów w linku. Skontaktuj się z organizatorem.`,
      errLoad: `Nie udało się wczytać wyniku. Spróbuj ponownie albo skontaktuj się z organizatorem.`,
      errNotFound: `Nie znaleziono wyniku. Sprawdź, czy masz właściwy, kompletny link, albo skontaktuj się z organizatorem.`,
      errUnexpected: `Nieoczekiwany błąd. Spróbuj ponownie później.`
    },
    en: {
      docTitle: `🎁 Your Secret Santa draw`,
      subtitle: `Your personal gift-draw link.`,
      loading: `Loading…`,
      revealBtn: `Show my result`,
      revealLabel: `You're buying a gift for:`,
      wishBtn: `Open the wish list`,
      secret: `Keep it a secret 🤫`,
      footer: `Made for private use by`,
      budget: `Gift budget: `,
      errParams: `The link is missing required parameters. Please contact the organizer.`,
      errLoad: `Couldn't load your result. Try again or contact the organizer.`,
      errNotFound: `Result not found. Check that you have the correct, complete link, or contact the organizer.`,
      errUnexpected: `Unexpected error. Please try again later.`
    }
  };

  // Język wybiera organizator i zapisuje go w linku (&lang=en). Brak parametru = polski.
  // The organizer picks the language and it is stored in the link (&lang=en). No parameter = Polish.
  const lang = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'pl';
  const t = (key) => T[lang][key];
  const greeting = (name) => (lang === 'en' ? `Hi, ${name}!` : `Cześć, ${name}!`);

  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
</script>

  <!-- Supabase JS client (wersja przypięta / pinned version) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
  // === KONFIGURACJA SUPABASE / SUPABASE CONFIG ===
  // Klucz "anon" jest publiczny z założenia. Bezpieczeństwo zapewniają reguły w bazie
  // (patrz supabase-setup.sql): wynik zwraca funkcja get_assignment tylko przy poprawnym tokenie.
  // The "anon" key is public by design. Security comes from the database rules
  // (see supabase-setup.sql): get_assignment returns a result only with the correct token.
  const SUPABASE_URL = "https://xlvrqqcaaopvtsxxdymt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsdnJxcWNhYW9wdnRzeHhkeW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNjQ4MzIsImV4cCI6MjA4MDk0MDgzMn0.v30XN8V0UvxDMfRp3JWFCPR8aThoh0E4fTR_oHqiXSU";

  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);

  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  // Zwraca poprawny adres http(s) albo null (blokuje m.in. javascript:)
  function safeHttpUrl(value) {
    try {
      const u = new URL(value);
      return (u.protocol === 'https:' || u.protocol === 'http:') ? u.toString() : null;
    } catch (e) {
      return null;
    }
  }

  let result = null;

  function showError(message) {
    $('loading').hidden = true;
    $('greeting').hidden = true;
    $('gate').hidden = true;
    $('error').textContent = message;
  }

  async function loadResult() {
    const drawId = getQueryParam('drawId');
    const name = getQueryParam('name');
    const token = getQueryParam('token');

    if (!drawId || !name || !token) {
      showError(t('errParams'));
      return;
    }

    try {
      // Serwer sprawdza token i zwraca wyłącznie wynik tej jednej osoby.
      const { data, error } = await _supabase.rpc('get_assignment', {
        p_draw_id: drawId,
        p_name: name,
        p_token: token
      });

      if (error) {
        console.error(error);
        showError(t('errLoad'));
        return;
      }

      const row = Array.isArray(data) ? data[0] : data;
      if (!row) {
        showError(t('errNotFound'));
        return;
      }

      result = row;
      $('loading').hidden = true;
      $('greeting').textContent = greeting(name);
      $('greeting').hidden = false;
      $('gate').hidden = false;

    } catch (e) {
      console.error(e);
      showError(t('errUnexpected'));
    }
  }

  function reveal() {
    if (!result) return;

    $('receiverName').textContent = result.receiver;

    let hasDetails = false;

    if (result.budget && result.budget.trim() !== '') {
      const budgetEl = $('budgetInfo');
      budgetEl.textContent = '';
      budgetEl.append(t('budget'));
      const strong = document.createElement('strong');
      strong.textContent = result.budget.trim();
      budgetEl.appendChild(strong);
      budgetEl.hidden = false;
      hasDetails = true;
    }

    const wishUrl = result.wish_link ? safeHttpUrl(result.wish_link.trim()) : null;
    if (wishUrl) {
      const a = $('wishLink');
      a.href = wishUrl;
      a.hidden = false;
      hasDetails = true;
    }

    $('details').hidden = !hasDetails;
    $('gate').hidden = true;

    const box = $('reveal');
    box.hidden = false;
    box.focus({ preventScroll: true }); // czytniki ekranu odczytają wynik / screen readers read the result
  }

  $('revealBtn').addEventListener('click', reveal);
  loadResult();
</script>
</body>
</html>
